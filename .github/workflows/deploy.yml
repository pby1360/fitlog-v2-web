name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the current main commit to production
        type: boolean
        default: false
        required: true

env:
  PROJECT_ID: fitlog-505315

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: plan
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: bash .github/scripts/classify-changes.sh

  # ── 품질 게이트: 린트·타입 검사가 실패하면 배포하지 않는다 ──
  check:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a verified change range
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Could not verify the files changed by this event."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Verify the bundle
        if: needs.changes.outputs.kind != 'non-runtime'
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Install Chromium and system dependencies
        if: needs.changes.outputs.kind != 'non-runtime'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        if: needs.changes.outputs.kind != 'non-runtime'
        run: npm test

  deploy:
    needs: [changes, check]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.kind == 'runtime'
    runs-on: ubuntu-latest

    # 배포는 한 번에 하나씩 실행한다
    concurrency:
      group: deploy-firebase-hosting
      cancel-in-progress: false

    # WIF 사용에 필수. 없으면 GitHub이 OIDC 토큰을 발급하지 않는다.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check current main
        id: latest
        run: bash .github/scripts/require-current-main.sh

      - uses: actions/setup-node@v4
        if: steps.latest.outputs.current == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.latest.outputs.current == 'true'
        run: npm ci

      - name: Build and verify the production bundle
        if: steps.latest.outputs.current == 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "::error::VITE_API_BASE_URL is empty."; exit 1; }
          npm run build
          if [[ ! -f out/index.html || ! -d out/assets ]]; then
            echo "::error::The build is missing out/index.html or out/assets."
            exit 1
          fi
          grep -rFq -- "${VITE_API_BASE_URL#*://}" out/assets ||
            { echo "::error::The bundle is missing the configured API URL."; exit 1; }

      # ── 인증: 키 파일 없이 OIDC 토큰을 임시 자격증명으로 교환 ──
      - name: Authenticate to Google Cloud
        if: steps.latest.outputs.current == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Recheck current main before publishing
        if: steps.latest.outputs.current == 'true'
        id: release
        run: bash .github/scripts/require-current-main.sh

      # firebase-tools 는 GOOGLE_APPLICATION_CREDENTIALS(위 단계가 설정)를 자동으로 사용한다.
      # 별칭(.firebaserc 의 `fitlog`) 대신 --project 로 명시해 CI에서의 모호함을 없앤다.
      - name: Deploy to Firebase Hosting
        if: steps.release.outputs.current == 'true'
        run: npx firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Summary
        if: steps.release.outputs.current == 'true'
        run: |
          echo "### 배포 완료 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- 커밋: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- https://fit2log.com" >> $GITHUB_STEP_SUMMARY
          echo "- https://fitlog-505315-5af8e.web.app" >> $GITHUB_STEP_SUMMARY
